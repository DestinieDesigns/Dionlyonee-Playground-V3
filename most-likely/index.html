<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dionlyonee Most Likely</title>

    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 25px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: white;

            background:

                radial-gradient(
                    circle at 50% 0%,
                    #174647,
                    #071415 45%,
                    #020404
                );

        }


        .launcher {

            width: 100%;

            max-width: 850px;

            text-align: center;

        }


        .logo {

            width: 65px;

            height: 65px;

            margin:
                0 auto 22px;

            display: flex;

            align-items: center;

            justify-content: center;

            border:
                2px solid
                #d4af37;

            border-radius: 16px;

            color:
                #d4af37;

            font-size: 30px;

            font-weight: 900;

        }


        .brand {

            color:
                #d4af37;

            font-size: 13px;

            font-weight: 900;

            letter-spacing: 5px;

        }


        h1 {

            margin:
                12px 0 0;

            font-size:
                clamp(
                    45px,
                    8vw,
                    82px
                );

            line-height:
                .9;

            letter-spacing: 4px;

        }


        .subtitle {

            margin-top: 18px;

            color:
                #718283;

            font-size: 9px;

            font-weight: 900;

            letter-spacing: 4px;

        }


        .line {

            width: 100px;

            height: 2px;

            margin:
                28px auto;

            background:
                #d4af37;

        }


        .description {

            max-width: 500px;

            margin:
                0 auto 35px;

            color:
                #718283;

            font-size: 11px;

            line-height: 1.7;

        }


        .options {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 18px;

        }


        .option {

            min-height: 220px;

            padding: 28px;

            border:
                1px solid
                rgba(255,255,255,.08);

            border-radius: 20px;

            background:
                linear-gradient(
                    145deg,
                    #111b1c,
                    #060909
                );

            color: white;

            cursor: pointer;

            transition:
                .25s ease;

        }


        .option:hover {

            transform:
                translateY(-5px);

            border-color:
                rgba(212,175,55,.5);

            box-shadow:
                0 20px 50px
                rgba(0,0,0,.45);

        }


        .icon {

            font-size: 42px;

            margin-bottom: 18px;

        }


        .option-title {

            color:
                #d4af37;

            font-size: 17px;

            font-weight: 900;

            letter-spacing: 3px;

        }


        .option-text {

            margin-top: 12px;

            color:
                #718081;

            font-size: 10px;

            line-height: 1.6;

        }


        @media(max-width:650px) {

            .options {

                grid-template-columns:
                    1fr;

            }

        }

    </style>

</head>


<body>


<div class="launcher">


    <div class="logo">
        D
    </div>


    <div class="brand">
        DIONLYONEE
    </div>


    <h1>
        MOST LIKELY
    </h1>


    <div class="subtitle">
        THE CONVERSATION GAME
    </div>


    <div class="line"></div>


    <p class="description">

        Ask the question,
        let chat debate it,
        and find out who is most likely.

    </p>


    <div class="options">


        <button
            class="option"
            type="button"
            onclick="openHost()"
        >

            <div class="icon">
                🎤
            </div>

            <div class="option-title">
                HOST CONTROL
            </div>

            <div class="option-text">

                Control the deck,
                draw questions,
                and run the game.

            </div>

        </button>


        <button
            class="option"
            type="button"
            onclick="openLive()"
        >

            <div class="icon">
                📺
            </div>

            <div class="option-title">
                LIVE GAME
            </div>

            <div class="option-text">

                Audience screen for
                your stream and chat.

            </div>

        </button>


    </div>


</div>


<script>

function openHost() {

    window.open(
        "most-likely-host.html",
        "_blank"
    );

}


function openLive() {

    window.open(
        "most-likely-live.html",
        "_blank"
    );

}

</script>


</body>

</html>
