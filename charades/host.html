<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dionlyonee Host — CHARADES</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="host-screen">
    <header id="host-header" class="host-header"></header>
    <main class="host-main">
      <div id="prompt-container"></div>
      <div id="host-timer-controls" class="host-settings"></div>
      <div class="host-controls">
        <button type="button" class="next-game" onclick="window.gameHost.prevPrompt()">◀ PREV PROMPT</button>
        <button type="button" id="btn-start-timer" class="start-game" onclick="window.gameHost.startTimer()">▶ START TIMER</button>
        <button type="button" class="next-game" onclick="window.gameHost.nextPrompt()">NEXT PROMPT ▶</button>
      </div>
      <div class="host-message">
        BROADCASTING OVER DIONLYONEE STREAM NETWORK • LIVE AUDIENCE SYNCHRONIZED
      </div>
    </main>
  </div>
  <script src="../sounds.js"></script>
  <script src="../shared/stream-games-data.js"></script>
  <script src="../shared/stream-game-host.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      window.gameHost = new StreamGameHost("charades");
    });
  </script>
</body>
</html>
