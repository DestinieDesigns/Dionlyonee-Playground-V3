<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Reveal Mystery Live Stage | Dionlyonee Stream</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/global.css" />
  <link rel="stylesheet" href="../css/word-reveal.css" />
  <link rel="stylesheet" href="../css/word-animations.css" />
  <link rel="stylesheet" href="word-live.css" />
</head>
<body>
  <header class="main-header">
    <div class="brand">
      <div class="brand-icon" style="background: linear-gradient(135deg, #10b981, #047857); color: #fff;">🔤</div>
      <div>
        <div class="brand-title">WORD REVEAL MYSTERY</div>
        <div class="brand-tag">AUDIENCE LIVE STAGE OVERLAY</div>
      </div>
    </div>
    <div id="header-hud"></div>
  </header>

  <main class="live-stage-wrapper">
    <!-- AUTOPILOT INTERMISSION BANNER -->
    <div id="live-intermission-banner" class="live-intermission-banner">
      <span style="font-size: 20px;">⚡</span>
      <span style="font-size: 13px; font-weight: 900; letter-spacing: 1.5px; color: #fff; text-transform: uppercase;">
        AUTOPILOT: NEXT MYSTERY IN <strong id="live-intermission-seconds" style="color: #34d399; font-size: 16px;">5s</strong>
      </span>
    </div>

    <!-- CATEGORY & POINTS BADGES -->
    <div style="display: flex; gap: 10px; align-items: center; justify-content: center; margin-bottom: 24px;">
      <div id="live-cat-badge" style="
        display: inline-block; padding: 6px 18px; border-radius: 9999px;
        background: rgba(16, 185, 129, 0.15); border: 1.5px solid rgba(16, 185, 129, 0.4);
        color: #34d399; font-size: 12px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase;
        box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
      ">
        WORD REVEAL MYSTERY
      </div>

      <div id="live-points-badge" style="
        display: inline-block; padding: 6px 14px; border-radius: 9999px;
        background: rgba(251, 191, 36, 0.15); border: 1.5px solid rgba(251, 191, 36, 0.4);
        color: #fbbf24; font-size: 12px; font-weight: 900; letter-spacing: 1px;
      ">
        +600 PTS
      </div>
    </div>

    <!-- AUDIENCE 3D LETTER CARDS BOARD -->
    <div class="word-tiles-wrap" id="live-tiles-grid"></div>

    <!-- UNLOCKED CLUE CARDS -->
    <div id="live-hint-container" style="max-width: 800px; width: 100%; margin: 10px auto 28px auto;"></div>

    <!-- AUDIENCE INTERACTIVE VIEWER GUESS BAR -->
    <div class="viewer-guess-bar" id="live-guess-widget">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 18px;">💬</span>
          <span style="font-size: 12px; font-weight: 800; color: #fbbf24; letter-spacing: 1px;">
            STREAM VIEWER GUESS (TYPE & ENTER)
          </span>
        </div>
        <span style="font-size: 10.5px; color: #94a3b8;">
          Instant winner detection & leaderboard credit
        </span>
      </div>

      <form id="live-chat-guess-form" style="display: flex; gap: 8px; margin-top: 4px;">
        <input 
          type="text" 
          id="live-chat-name" 
          placeholder="@YourName" 
          style="width: 120px; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; color: #fff; font-size: 12px; font-weight: 700; padding: 8px 12px;" 
          required 
        />
        <input 
          type="text" 
          id="live-chat-text" 
          placeholder="Guess the mystery phrase or word..." 
          style="flex: 1; background: rgba(0,0,0,0.6); border: 1.5px solid rgba(212,175,55,0.4); border-radius: 8px; color: #fff; font-size: 13px; font-weight: 700; padding: 8px 12px;" 
          required 
        />
        <button 
          type="submit" 
          style="background: linear-gradient(135deg, #d4af37, #b8860b); color: #000; font-weight: 900; font-size: 11px; letter-spacing: 0.5px; border: none; border-radius: 8px; padding: 0 16px; cursor: pointer;"
        >
          GUESS ↵
        </button>
      </form>
      <div id="live-chat-feedback" style="display: none; font-size: 11.5px; font-weight: 800; color: #34d399; text-align: center; margin-top: 4px;"></div>
    </div>

    <!-- CONTESTANTS SCORES ROW -->
    <div style="margin-top: 36px; width: 100%; max-width: 800px; text-align: center;">
      <h3 style="font-family: 'Cinzel', serif; font-size: 15px; color: #94a3b8; letter-spacing: 1.5px; margin-bottom: 14px;">
        CONTESTANT SCORES
      </h3>
      <div id="live-contestants-row" style="display: flex; flex-wrap: wrap; gap: 16px; justify-content: center;"></div>
    </div>
  </main>

  <!-- WINNER CELEBRATION OVERLAY -->
  <div id="live-winner-overlay" class="live-winner-overlay">
    <div class="winner-modal-box animate-winner">
      <div style="font-size: 32px; margin-bottom: 8px;">👑</div>
      <div style="font-size: 12px; font-weight: 900; letter-spacing: 3px; color: #fbbf24; text-transform: uppercase;">
        MYSTERY SOLVED!
      </div>
      <div id="winner-answer-display" class="winner-answer-callout">
        PHRASE REVEALED
      </div>
      <div id="winner-credit-line" style="font-size: 18px; font-weight: 800; color: #34d399; margin-bottom: 12px;">
        GREAT JOB!
      </div>
      <div style="font-size: 13px; color: #94a3b8;">
        ◆ ◆ ◆
      </div>
    </div>
  </div>

  <div id="live-confetti" class="confetti-container"></div>

  <script src="../../shared/sound-manager.js"></script>
  <script src="../../shared/room-manager.js"></script>
  <script src="../../shared/firebase-room.js"></script>
  <script src="../../shared/room-ui.js"></script>
  <script src="../../shared/contestant-manager.js"></script>
  <script src="../data/categories.js"></script>
  <script src="../data/hints.js"></script>
  <script src="../js/reveal-engine.js"></script>
  <script src="../js/hint-engine.js"></script>
  <script src="word-live.js"></script>
</body>
</html>
